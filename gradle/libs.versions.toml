[versions]
agp = "9.3.2"
kotlin = "2.4.10"
coreKtx = "1.13.1"
lifecycle = "2.8.6"
activityCompose = "1.9.2"
composeBom = "2026.08.00"
osmdroid = "6.1.20"
jpx = "3.2.1"
coroutines = "1.11.0"
staxApi = "1.0-2"
aaltoXml = "1.3.3"
room = "2.8.4"
ksp = "2.3.11"
datastore = "1.2.1"
navigationCompose = "2.8.9"
exifinterface = "1.3.7"
coil = "2.7.0"
# RIC-163 : 2.1.5 est la première version à couvrir Stream.toList() (JDK 16), ajoutée le
# 2025-02-14 (CHANGELOG google/desugar_jdk_libs) ; c'est aussi la dernière version publiée au
# 2026-09-04 (maven-metadata.xml de dl.google.com), donc pas de choix à arbitrer entre plusieurs
# versions valides.
desugarJdkLibs = "2.1.5"

[libraries]
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
ui = { group = "androidx.compose.ui", name = "ui" }
ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
material3 = { group = "androidx.compose.material3", name = "material3" }
material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
osmdroid-android = { group = "org.osmdroid", name = "osmdroid-android", version.ref = "osmdroid" }
jpx = { group = "io.jenetics", name = "jpx", version.ref = "jpx" }
stax-api = { group = "javax.xml.stream", name = "stax-api", version.ref = "staxApi" }
aalto-xml = { group = "com.fasterxml", name = "aalto-xml", version.ref = "aaltoXml" }
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
exifinterface = { group = "androidx.exifinterface", name = "exifinterface", version.ref = "exifinterface" }
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }
desugar-jdk-libs = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugarJdkLibs" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# RIC-111 : org.jetbrains.kotlin.android retiré — AGP 9.x active par défaut son support Kotlin
# intégré ("built-in Kotlin") et son nouveau DSL, structurellement incompatible avec le plugin
# Kotlin externe (voir commit AGP pour le détail). kotlin-compose reste piloté par `kotlin` : ce
# plugin compilateur Compose est indépendant du built-in Kotlin et doit rester en phase avec la
# version de Kotlin utilisée pour compiler.
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
